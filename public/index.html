<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Prueba de Radio</title>
</head>

<body>
    <h1>Reproductor de Radio Proxy</h1>

    <button id="playButton">Iniciar Reproducción</button>

    <audio id="radioPlayer" controls style="display:none"></audio>

    <script>
        const playButton = document.getElementById('playButton');
        const radioPlayer = document.getElementById('radioPlayer');

        function startStream() {
            // Añadimos un parámetro de tiempo (?t=...) para saltarnos la caché del navegador
            radioPlayer.src = '/stream?t=' + Date.now();
            radioPlayer.style.display = 'block';

            radioPlayer.play().catch(err => {
                console.error('Error o interacción requerida para reproducir:', err);
            });
        }

        playButton.addEventListener('click', () => {
            startStream();
        });

        // 🔴 RECONEXIÓN AUTOMÁTICA CUANDO EL STREAM SE CORTE
        radioPlayer.addEventListener('error', () => {
            console.warn('El stream se interrumpió. Reconectando en 3 segundos...');
            setTimeout(() => {
                startStream();
            }, 3000);
        });

        // 🔴 SI EL BUFFER SE ATASCA POR INACTIVIDAD
        radioPlayer.addEventListener('stalled', () => {
            console.warn('Transmisión detenida. Forzando reconexión...');
            startStream();
        });
    </script>
</body>

</html>
